version: '3.8'

services:
  jupyter:
    build: .
    volumes:
      - .:/app
    ports:
      - "8888:8888"
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
    environment:
      - JUPYTER_ENABLE_LAB=yes

  runner:
    build: .
    volumes:
      - .:/app
    command: python score.py --predictions validation_predictions.csv --december-predictions data/december_chart_inputs.csv
