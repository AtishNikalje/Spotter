services:
  dashboard:
    build: .
    volumes:
      - .:/app
      - /app/.venv
    ports:
      - "8501:8501"
    command: streamlit run dashboard.py --server.address=0.0.0.0 --server.port=8501

  runner:
    build: .
    volumes:
      - .:/app
      - /app/.venv
    command:
      [
        "sh",
        "-c",
        "python src/train.py && python score.py --predictions validation_predictions.csv --december-predictions data/december-chart-inputs.csv",
      ]
